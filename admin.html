<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Nayah Allure | Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>tailwind.config={theme:{extend:{colors:{gold:{DEFAULT:'#D4AF37',dark:'#AA7C11'},charcoal:'#121212',darkgray:'#1C1C1C'}}}};</script>
<style>
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#0d0d0d;color:#f3f3f3}
.field{width:100%;background:#0d0d0d;border:1px solid #333;border-radius:.375rem;padding:.5rem .7rem;font-size:.875rem;color:#f3f3f3}
.field:focus{outline:none;border-color:#D4AF37}
.btn{background:#D4AF37;color:#000;font-weight:700;border-radius:.375rem;padding:.55rem 1rem;font-size:.8rem}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5}
.btn-o{border:1px solid #D4AF37;color:#D4AF37;border-radius:.375rem;padding:.55rem 1rem;font-size:.8rem;cursor:pointer;display:inline-block}
.btn-o:hover{background:rgba(212,175,55,.1)}
:focus-visible,.photo:focus-within{outline:2px solid #D4AF37;outline-offset:2px}
</style>
</head>
<body>
<main id="login" class="min-h-screen flex items-center justify-center p-4">
  <form id="loginForm" class="w-full max-w-sm bg-darkgray border border-gold/30 rounded-xl p-8 space-y-4">
    <h1 class="text-xl font-bold text-gold text-center tracking-widest">NAYAH ALLURE ADMIN</h1>
    <div><label for="u" class="text-xs text-gray-400">Email</label><input id="u" type="email" class="field" required autocomplete="username"></div>
    <div><label for="p" class="text-xs text-gray-400">Password</label><input id="p" type="password" class="field" required autocomplete="current-password"></div>
    <p id="err" class="text-red-400 text-xs min-h-[1rem]" role="alert"></p>
    <button id="loginBtn" class="btn w-full" type="submit">Sign in</button>
    <a href="index.html" class="block text-center text-xs text-gray-500 hover:text-gold">← Back to website</a>
  </form>
</main>

<div id="app" hidden>
  <header class="bg-black border-b border-gold/20 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <span class="font-bold text-gold tracking-widest">ADMIN</span>
      <div class="flex items-center gap-3"><span id="status" class="text-xs" role="status"></span><a href="index.html" target="_blank" class="btn-o">View site</a><button id="logout" class="btn-o" type="button">Log out</button></div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-8 space-y-10">
    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-gold">Online orders (Paystack)</h2>
        <button id="ordersRefresh" type="button" class="btn-o text-xs"><i class="fas fa-rotate mr-1" aria-hidden="true"></i>Refresh</button>
      </div>
      <div class="bg-darkgray border border-gold/20 rounded-lg overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-xs text-gray-400 uppercase text-left"><tr><th class="p-3">Date</th><th class="p-3">Reference</th><th class="p-3">Customer</th><th class="p-3">Items</th><th class="p-3 text-right">Amount</th><th class="p-3">Status</th></tr></thead>
          <tbody id="orders"></tbody>
        </table>
      </div>
    </section>
    <section>
      <h2 class="text-lg font-bold text-gold mb-4">Add new item</h2>
      <form id="addForm" class="bg-darkgray border border-gold/20 rounded-lg p-4 grid md:grid-cols-[160px_1fr] gap-4">
        <div>
          <div id="newPreview" class="h-40 bg-black/50 rounded flex items-center justify-center overflow-hidden text-gray-600"><i class="fas fa-image text-3xl" aria-hidden="true"></i></div>
          <label class="photo btn-o block text-center text-xs mt-2"><i class="fas fa-camera mr-1" aria-hidden="true"></i>Choose photo<input id="newPhoto" type="file" accept="image/*" class="sr-only"></label>
        </div>
        <div class="grid sm:grid-cols-3 gap-3 content-start">
          <label class="sm:col-span-3 text-xs text-gray-400">Item name<input id="newName" class="field mt-1" required maxlength="80" placeholder="e.g. Pearl Drop Earrings"></label>
          <label class="text-xs text-gray-400">Category<input id="newCat" class="field mt-1" required maxlength="40" list="cats" placeholder="Jewelry"></label>
          <label class="text-xs text-gray-400">Price (KSh)<input id="newPrice" class="field mt-1" type="number" min="0" step="1" required placeholder="1500"></label>
          <div class="flex items-end"><button id="addBtn" class="btn w-full" type="submit"><i class="fas fa-plus mr-1" aria-hidden="true"></i> Add item</button></div>
        </div>
      </form>
    </section>
    <section>
      <h2 class="text-lg font-bold text-gold mb-4">Items on the site</h2>
      <div id="products" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>
    <section>
      <h2 class="text-lg font-bold text-gold mb-4">Service prices</h2>
      <div id="services" class="grid md:grid-cols-3 gap-4"></div>
    </section>
  </main>
</div>

<script>
(() => {
'use strict';

const SUPABASE_URL = 'https://znzfxfsmrcxkeuathtos.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuemZ4ZnNtcmN4a2V1YXRodG9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMTI2NDEsImV4cCI6MjEwNzg4ODY0MX0.o-JGKaJ0IlAB3yi5kiXeYCe4Mfuerj-EumeCNvshIvo';
const BUCKET = 'nayah-photos';
const SERVICES = [
  { id: 'lashes', name: 'Lash Extensions', items: [['Classic Natural Set', 2500], ['Hybrid Glamour Set', 3500], ['Russian Volume Set', 4500]] },
  { id: 'wigs', name: 'Wig Installation & Styling', items: [['Frontal Wig Melt & Install', 3500], ['Closure Wig Install', 3000], ['Wig Revamp & Coloring', 2500]] },
  { id: 'waxing', name: 'Waxing', items: [['Eyebrow Wax & Shape', 500], ['Underarm Wax', 700], ['Full Leg Wax', 2000]] }
];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if (SUPABASE_URL.startsWith('PASTE') || !window.supabase) { $('#err').textContent = 'Not configured: paste your Supabase URL and key at the top of this script.'; $('#loginBtn').disabled = true; return; }
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const photoUrl = p => p ? sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl : '';

let items = [], prices = {}, newFile = null, timers = {}, statusTimer;
function setStatus(t, bad) {
  const s = $('#status'); s.textContent = t; s.className = 'text-xs ' + (bad ? 'text-red-400' : 'text-emerald-400');
  clearTimeout(statusTimer); statusTimer = setTimeout(() => s.textContent = '', 5000);
}
const fail = (e, what) => { console.error(e); setStatus(`${what}: ${e.message || e}`, true); };

/* ---------- Auth ---------- */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#loginBtn').disabled = true; $('#err').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#u').value.trim(), password: $('#p').value });
  $('#loginBtn').disabled = false;
  if (error) { $('#err').textContent = 'Invalid email or password.'; return; }
  $('#p').value = ''; enter();
});
$('#logout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

async function enter() {
  $('#login').hidden = true; $('#app').hidden = false;
  await refresh();
}
async function refresh() {
  const [p, s] = await Promise.all([
    sb.from('nayah_products').select('*').order('created_at', { ascending: false }),
    sb.from('nayah_settings').select('value').eq('key', 'service_prices').maybeSingle()
  ]);
  if (p.error) return fail(p.error, 'Could not load items');
  items = p.data; prices = (s.data && s.data.value) || {}; render();
  loadOrders();
}

/* ---------- Orders ---------- */
const STATUS_CLS = { paid: 'bg-emerald-500/20 text-emerald-300', pending: 'bg-yellow-500/20 text-yellow-300', failed: 'bg-red-500/20 text-red-300' };
async function loadOrders() {
  const { data, error } = await sb.from('nayah_orders').select('*').order('created_at', { ascending: false }).limit(100);
  if (error) { $('#orders').innerHTML = `<tr><td colspan="6" class="p-3 text-gray-400">Orders unavailable (${esc(error.message)}). Has the orders migration been run?</td></tr>`; return; }
  $('#orders').innerHTML = data.length ? data.map(o => `
    <tr class="border-t border-gray-800 align-top">
      <td class="p-3 whitespace-nowrap text-gray-400">${esc(new Date(o.created_at).toLocaleString('en-KE', { dateStyle: 'medium', timeStyle: 'short' }))}</td>
      <td class="p-3 font-mono text-xs">${esc(o.reference)}</td>
      <td class="p-3">${esc(o.customer_name)}<div class="text-xs text-gray-400">${esc(o.customer_phone)} · ${esc(o.customer_email)}</div></td>
      <td class="p-3 text-xs text-gray-300">${(o.items || []).map(i => `${i.qty} × ${esc(i.name)}`).join('<br>')}</td>
      <td class="p-3 text-right whitespace-nowrap">KSh ${Number(o.amount).toLocaleString('en-KE')}</td>
      <td class="p-3"><span class="text-xs px-2 py-0.5 rounded-full ${STATUS_CLS[o.status] || ''}">${esc(o.status)}</span>${o.channel ? `<div class="text-[10px] text-gray-500 mt-1">${esc(o.channel.replace('_', ' '))}</div>` : ''}</td>
    </tr>`).join('') : '<tr><td colspan="6" class="p-3 text-gray-400">No online orders yet.</td></tr>';
}
$('#ordersRefresh').addEventListener('click', loadOrders);

/* ---------- Photos ---------- */
async function toJpegBlob(file, max = 900) {
  if (!file.type.startsWith('image/')) throw new Error('Please choose an image file.');
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Could not process image')), 'image/jpeg', 0.82));
}
async function uploadPhoto(file) {
  const path = `${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from(BUCKET).upload(path, await toJpegBlob(file), { contentType: 'image/jpeg', cacheControl: '31536000' });
  if (error) throw error;
  return path;
}
const removePhoto = path => path && sb.storage.from(BUCKET).remove([path]);

/* ---------- Render ---------- */
const thumb = p => p.img_path ? `<img src="${esc(photoUrl(p.img_path))}" alt="" class="w-full h-full object-cover">` : `<i class="fas ${esc(p.icon || 'fa-gem')} text-gold text-3xl" aria-hidden="true"></i>`;
function render() {
  const cats = [...new Set(items.map(p => p.category))];
  $('#products').innerHTML = items.length ? items.map(p => `
    <div class="bg-darkgray border border-gold/20 rounded-lg p-3 space-y-2">
      <div class="h-40 bg-black/50 rounded flex items-center justify-center overflow-hidden">${thumb(p)}</div>
      <label class="photo btn-o block text-center text-xs"><i class="fas fa-camera mr-1" aria-hidden="true"></i>${p.img_path ? 'Change photo' : 'Add photo'}<input type="file" accept="image/*" class="sr-only" data-up="${esc(p.id)}"></label>
      <input class="field" data-id="${esc(p.id)}" data-f="name" maxlength="80" value="${esc(p.name)}" aria-label="Item name">
      <div class="grid grid-cols-2 gap-2">
        <input class="field" data-id="${esc(p.id)}" data-f="category" maxlength="40" value="${esc(p.category)}" list="cats" aria-label="Category">
        <input class="field" type="number" min="0" step="1" data-id="${esc(p.id)}" data-f="price" value="${p.price}" aria-label="Price in KSh">
      </div>
      <div class="flex justify-between items-center text-xs">
        <label class="flex items-center gap-2 text-gray-300"><input type="checkbox" data-id="${esc(p.id)}" data-f="active" ${p.active ? 'checked' : ''}> Visible on site</label>
        <button type="button" class="text-red-400 hover:underline" data-del="${esc(p.id)}">Delete</button>
      </div>
    </div>`).join('') + `<datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>` : '<p class="text-gray-400 text-sm">No items yet. Add your first one above.</p>';
  $('#services').innerHTML = SERVICES.map(s => `
    <div class="bg-darkgray border border-gold/20 rounded-lg p-4 space-y-3">
      <h3 class="font-semibold text-gold">${esc(s.name)}</h3>
      ${s.items.map(([n, def], i) => `<label class="block text-xs text-gray-400">${esc(n)}<input class="field mt-1" type="number" min="0" step="1" data-s="${s.id}" data-i="${i}" value="${Number(prices[s.id]?.[i] ?? def)}"></label>`).join('')}
    </div>`).join('');
}

/* ---------- Edits (auto-saved to Supabase) ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.id) {
    const f = t.dataset.f, id = t.dataset.id;
    const v = f === 'active' ? t.checked : f === 'price' ? Math.max(0, Math.round(Number(t.value) || 0)) : t.value.trim();
    if ((f === 'name' || f === 'category') && !v) return;
    const row = items.find(x => x.id === id); if (row) row[f] = v;
    clearTimeout(timers[id + f]);
    timers[id + f] = setTimeout(async () => {
      const { error } = await sb.from('nayah_products').update({ [f]: v }).eq('id', id);
      error ? fail(error, 'Save failed') : setStatus('Saved ✓');
    }, 500);
  } else if (t.dataset.s) {
    const s = SERVICES.find(x => x.id === t.dataset.s);
    prices[s.id] = prices[s.id] || s.items.map(i => i[1]);
    prices[s.id][t.dataset.i] = Math.max(0, Math.round(Number(t.value) || 0));
    clearTimeout(timers.svc);
    timers.svc = setTimeout(async () => {
      const { error } = await sb.from('nayah_settings').upsert({ key: 'service_prices', value: prices });
      error ? fail(error, 'Save failed') : setStatus('Saved ✓');
    }, 500);
  }
});

document.addEventListener('change', async e => {
  const t = e.target, file = t.files && t.files[0];
  if (!file) return;
  try {
    if (t.id === 'newPhoto') {
      newFile = file; $('#newPreview').innerHTML = `<img src="${URL.createObjectURL(file)}" alt="Preview" class="w-full h-full object-cover">`;
    } else if (t.dataset.up) {
      setStatus('Uploading photo…');
      const row = items.find(x => x.id === t.dataset.up), old = row.img_path, path = await uploadPhoto(file);
      const { error } = await sb.from('nayah_products').update({ img_path: path }).eq('id', row.id);
      if (error) { await removePhoto(path); throw error; }
      row.img_path = path; await removePhoto(old); render(); setStatus('Photo updated ✓');
    }
  } catch (x) { fail(x, 'Photo failed'); }
  t.value = '';
});

$('#addForm').addEventListener('submit', async e => {
  e.preventDefault(); const btn = $('#addBtn'); btn.disabled = true;
  let path = null;
  try {
    if (newFile) path = await uploadPhoto(newFile);
    const { error } = await sb.from('nayah_products').insert({ name: $('#newName').value.trim(), category: $('#newCat').value.trim(), price: Math.max(0, Math.round(Number($('#newPrice').value) || 0)), img_path: path });
    if (error) throw error;
    newFile = null; path = null; e.target.reset(); $('#newPreview').innerHTML = '<i class="fas fa-image text-3xl" aria-hidden="true"></i>';
    await refresh(); setStatus('Item added ✓');
  } catch (x) { if (path) await removePhoto(path); fail(x, 'Could not add item'); }
  finally { btn.disabled = false; }
});

document.addEventListener('click', async e => {
  const t = e.target.closest('button[data-del]'); if (!t) return;
  const row = items.find(x => x.id === t.dataset.del);
  if (!row || !confirm(`Delete “${row.name}” and its photo?`)) return;
  const { error } = await sb.from('nayah_products').delete().eq('id', row.id);
  if (error) return fail(error, 'Delete failed');
  await removePhoto(row.img_path); items = items.filter(x => x.id !== row.id); render(); setStatus('Deleted ✓');
});

sb.auth.getSession().then(({ data }) => { if (data.session) enter(); });
})();
</script>
</body>
</html>
